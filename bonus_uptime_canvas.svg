<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 680" width="1450" height="680" style="background:#1a1b26; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="bonus-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="b-grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="b-grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="b-grad-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="b-grad-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="b-grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <marker id="b-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="b-arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="b-arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Top bar -->
  <rect x="0" y="0" width="1450" height="55" fill="#13141f"/>
  <circle cx="25" cy="27" r="6" fill="#ef4444"/>
  <circle cx="45" cy="27" r="6" fill="#f59e0b"/>
  <circle cx="65" cy="27" r="6" fill="#10b981"/>
  <text x="95" y="33" fill="#f8fafc" font-size="15" font-weight="bold">n8n Bonus Canvas: Bonus_UptimeMonitor_Sumaiah.json</text>
  <rect x="1220" y="14" width="200" height="28" rx="6" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6"/>
  <text x="1320" y="32" fill="#60a5fa" font-size="12" font-weight="bold" text-anchor="middle">UPTIME SLA ENGINE: 5m</text>

  <!-- Flow Lines -->
  <!-- Triggers to Init -->
  <path d="M 180 155 C 215 155, 215 200, 250 200" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#b-arrow)"/>
  <path d="M 180 255 C 215 255, 215 210, 250 210" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#b-arrow)"/>

  <!-- Init to Ping -->
  <path d="M 390 205 L 430 205" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#b-arrow)"/>

  <!-- Ping to Latency -->
  <path d="M 570 205 L 610 205" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#b-arrow)"/>

  <!-- Latency to IF Health -->
  <path d="M 770 205 L 810 205" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#b-arrow)"/>

  <!-- IF Health -> True: Log Heartbeat -->
  <path d="M 960 185 C 990 185, 990 135, 1030 135" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#b-arrow-green)"/>
  <text x="980" y="150" fill="#10b981" font-size="11" font-weight="bold">TRUE (200 OK)</text>

  <!-- IF Health -> False: Wait 3s Retry -->
  <path d="M 960 225 C 990 225, 990 280, 1030 280" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="5,5" marker-end="url(#b-arrow-red)"/>
  <text x="980" y="245" fill="#ef4444" font-size="11" font-weight="bold">FALSE (Non-200)</text>

  <!-- Wait 3s to Retry HTTP -->
  <path d="M 1180 280 L 1220 280" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#b-arrow)"/>

  <!-- Row 2: Retry HTTP to Confirmed IF -->
  <path d="M 1300 325 C 1300 420, 200 420, 200 490" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- Confirmed Outage IF to Outage Alert & Transient Flake -->
  <path d="M 370 515 C 410 515, 410 470, 460 470" fill="none" stroke="#ef4444" stroke-width="2.5" marker-end="url(#b-arrow-red)"/>
  <text x="390" y="485" fill="#ef4444" font-size="11" font-weight="bold">TRUE (Confirmed)</text>

  <path d="M 370 555 C 410 555, 410 600, 460 600" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#b-arrow)"/>
  <text x="390" y="585" fill="#f59e0b" font-size="11" font-weight="bold">FALSE (Recovered)</text>

  <!-- NODES -->
  <!-- Node 1: Schedule -->
  <g filter="url(#bonus-shadow)">
    <rect x="40" y="110" width="140" height="90" rx="10" fill="#24283b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="40" y="110" width="140" height="26" rx="10" fill="url(#b-grad-blue)"/>
    <text x="110" y="127" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">Schedule: 5 Min</text>
    <text x="110" y="155" fill="#cbd5e1" font-size="10.5" text-anchor="middle">Every 5 Minutes</text>
    <text x="110" y="175" fill="#94a3b8" font-size="9" text-anchor="middle">Continuous Polling</text>
  </g>

  <!-- Node 2: Test Webhook -->
  <g filter="url(#bonus-shadow)">
    <rect x="40" y="215" width="140" height="90" rx="10" fill="#24283b" stroke="#7c3aed" stroke-width="2"/>
    <rect x="40" y="215" width="140" height="26" rx="10" fill="url(#b-grad-purple)"/>
    <text x="110" y="232" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">Webhook Trigger</text>
    <text x="110" y="260" fill="#cbd5e1" font-size="10.5" text-anchor="middle">/test-uptime-ping</text>
    <text x="110" y="280" fill="#94a3b8" font-size="9" text-anchor="middle">Manual QA Health Check</text>
  </g>

  <!-- Node 3: Init Monitor Check -->
  <g filter="url(#bonus-shadow)">
    <rect x="250" y="160" width="140" height="90" rx="10" fill="#24283b" stroke="#059669" stroke-width="2"/>
    <rect x="250" y="160" width="140" height="26" rx="10" fill="url(#b-grad-green)"/>
    <text x="320" y="177" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">Init Latency Timer</text>
    <text x="320" y="205" fill="#cbd5e1" font-size="10" text-anchor="middle">Records t0 (ms)</text>
    <text x="320" y="225" fill="#94a3b8" font-size="9" text-anchor="middle">Target: demo.realworld.io</text>
  </g>

  <!-- Node 4: Ping HTTP -->
  <g filter="url(#bonus-shadow)">
    <rect x="430" y="160" width="140" height="90" rx="10" fill="#24283b" stroke="#d97706" stroke-width="2"/>
    <rect x="430" y="160" width="140" height="26" rx="10" fill="url(#b-grad-orange)"/>
    <text x="500" y="177" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">HTTP: Ping App</text>
    <text x="500" y="202" fill="#cbd5e1" font-size="10" text-anchor="middle">GET /api/articles</text>
    <text x="500" y="220" fill="#a7f3d0" font-size="9" text-anchor="middle">🛡️ Continue On Fail: ON</text>
    <text x="500" y="238" fill="#94a3b8" font-size="8.5" text-anchor="middle">10s Socket Timeout</text>
  </g>

  <!-- Node 5: Calculate Latency & SLA -->
  <g filter="url(#bonus-shadow)">
    <rect x="610" y="160" width="160" height="90" rx="10" fill="#24283b" stroke="#059669" stroke-width="2"/>
    <rect x="610" y="160" width="160" height="26" rx="10" fill="url(#b-grad-green)"/>
    <text x="690" y="177" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">Calculate Latency</text>
    <text x="690" y="202" fill="#cbd5e1" font-size="10" text-anchor="middle">Δt = t_end - t0 (ms)</text>
    <text x="690" y="220" fill="#cbd5e1" font-size="9.5" text-anchor="middle">Status: 200 vs non-200</text>
    <text x="690" y="238" fill="#94a3b8" font-size="9" text-anchor="middle">SLA: Latency &lt; 2500ms</text>
  </g>

  <!-- Node 6: IF Healthy -->
  <g filter="url(#bonus-shadow)">
    <rect x="810" y="160" width="150" height="90" rx="10" fill="#24283b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="810" y="160" width="150" height="26" rx="10" fill="url(#b-grad-blue)"/>
    <text x="885" y="177" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">IF: Status == 200?</text>
    <text x="885" y="205" fill="#cbd5e1" font-size="10" text-anchor="middle">HTTP Code Audit</text>
    <text x="885" y="225" fill="#94a3b8" font-size="9" text-anchor="middle">Routes Healthy vs Outage</text>
  </g>

  <!-- Node 7: Log Healthy Heartbeat -->
  <g filter="url(#bonus-shadow)">
    <rect x="1030" y="90" width="160" height="90" rx="10" fill="#24283b" stroke="#059669" stroke-width="2"/>
    <rect x="1030" y="90" width="160" height="26" rx="10" fill="url(#b-grad-green)"/>
    <text x="1110" y="107" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">Heartbeat OK (200)</text>
    <text x="1110" y="135" fill="#34d399" font-size="10.5" font-weight="bold" text-anchor="middle">Status: ONLINE</text>
    <text x="1110" y="152" fill="#cbd5e1" font-size="9.5" text-anchor="middle">Latency Logged (~180ms)</text>
    <text x="1110" y="168" fill="#94a3b8" font-size="9" text-anchor="middle">No alerts sent</text>
  </g>

  <!-- Node 8: Wait 3s Before Retry -->
  <g filter="url(#bonus-shadow)">
    <rect x="1030" y="235" width="150" height="90" rx="10" fill="#24283b" stroke="#7c3aed" stroke-width="2"/>
    <rect x="1030" y="235" width="150" height="26" rx="10" fill="url(#b-grad-purple)"/>
    <text x="1105" y="252" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">Wait 3s Retry Delay</text>
    <text x="1105" y="280" fill="#cbd5e1" font-size="10" text-anchor="middle">3 Second Backoff</text>
    <text x="1105" y="300" fill="#94a3b8" font-size="9" text-anchor="middle">Filters transient blips</text>
  </g>

  <!-- Node 9: Retry Verification Ping -->
  <g filter="url(#bonus-shadow)">
    <rect x="1220" y="235" width="160" height="90" rx="10" fill="#24283b" stroke="#d97706" stroke-width="2"/>
    <rect x="1220" y="235" width="160" height="26" rx="10" fill="url(#b-grad-orange)"/>
    <text x="1300" y="252" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">HTTP: Retry Ping</text>
    <text x="1300" y="278" fill="#cbd5e1" font-size="10" text-anchor="middle">Second Verification Call</text>
    <text x="1300" y="296" fill="#a7f3d0" font-size="9" text-anchor="middle">🛡️ Continue On Fail: ON</text>
    <text x="1300" y="312" fill="#94a3b8" font-size="8.5" text-anchor="middle">Prevents False Alarms</text>
  </g>

  <!-- ROW 2: Retry Decision & Alerts -->
  <!-- Node 10: Confirmed Outage IF -->
  <g filter="url(#bonus-shadow)">
    <rect x="210" y="490" width="160" height="90" rx="10" fill="#24283b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="210" y="490" width="160" height="26" rx="10" fill="url(#b-grad-blue)"/>
    <text x="290" y="507" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">Confirmed Outage?</text>
    <text x="290" y="535" fill="#cbd5e1" font-size="10" text-anchor="middle">Checks Retry Outcome</text>
    <text x="290" y="555" fill="#94a3b8" font-size="9" text-anchor="middle">Dual-Fail Confirmation</text>
  </g>

  <!-- Node 11: Dispatch Outage Alert -->
  <g filter="url(#bonus-shadow)">
    <rect x="460" y="425" width="170" height="90" rx="10" fill="#24283b" stroke="#dc2626" stroke-width="2"/>
    <rect x="460" y="425" width="170" height="26" rx="10" fill="url(#b-grad-red)"/>
    <text x="545" y="442" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">🚨 Outage Alert (Discord)</text>
    <text x="545" y="468" fill="#fca5a5" font-size="10" font-weight="bold" text-anchor="middle">HTTP 500 / DOWN</text>
    <text x="545" y="486" fill="#cbd5e1" font-size="9.5" text-anchor="middle">Status, Latency, Reason</text>
    <text x="545" y="502" fill="#cbd5e1" font-size="9" text-anchor="middle">Pings DevOps On-Call</text>
  </g>

  <!-- Node 12: Log Transient Flake -->
  <g filter="url(#bonus-shadow)">
    <rect x="460" y="555" width="170" height="90" rx="10" fill="#24283b" stroke="#d97706" stroke-width="2"/>
    <rect x="460" y="555" width="170" height="26" rx="10" fill="url(#b-grad-orange)"/>
    <text x="545" y="572" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">⚠️ Transient Recovery</text>
    <text x="545" y="598" fill="#fde68a" font-size="10" font-weight="bold" text-anchor="middle">Initial Flake Cleared</text>
    <text x="545" y="616" fill="#cbd5e1" font-size="9.5" text-anchor="middle">Logged to Slack Channel</text>
    <text x="545" y="632" fill="#94a3b8" font-size="9" text-anchor="middle">Suppressed High-Prio Alert</text>
  </g>
</svg>