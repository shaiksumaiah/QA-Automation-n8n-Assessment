<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 720" width="1450" height="720" style="background:#1e1e2e; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Canvas Header -->
  <rect x="0" y="0" width="1450" height="60" fill="#181825"/>
  <circle cx="25" cy="30" r="7" fill="#ef4444"/>
  <circle cx="45" cy="30" r="7" fill="#f59e0b"/>
  <circle cx="65" cy="30" r="7" fill="#10b981"/>
  <text x="95" y="36" fill="#f8fafc" font-size="16" font-weight="bold">n8n Workflow Canvas: Task2_Workflow_Sumaiah.json</text>
  <rect x="1250" y="16" width="160" height="28" rx="6" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e"/>
  <text x="1330" y="35" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle">STATUS: ACTIVE / READY</text>

  <!-- Connectors -->
  <!-- Triggers to HTTP 1 -->
  <path d="M 180 160 C 230 160, 230 220, 270 220" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 180 270 C 230 270, 230 240, 270 240" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- HTTP 1 to IF Check -->
  <path d="M 430 230 L 480 230" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- IF Check to Transform (True) -->
  <path d="M 640 210 C 670 210, 670 170, 700 170" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="665" y="185" fill="#10b981" font-size="11" font-weight="bold">TRUE (Success)</text>

  <!-- IF Check to Fallback Alert (False) -->
  <path d="M 640 250 C 670 250, 670 340, 700 340" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="5,5" marker-end="url(#arrow-red)"/>
  <text x="665" y="305" fill="#ef4444" font-size="11" font-weight="bold">FALSE (Fail)</text>

  <!-- Transform to HTTP 2 Enrich -->
  <path d="M 860 170 L 910 170" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- HTTP 2 Enrich to Merge -->
  <path d="M 1070 170 L 1110 170" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Merge to IF Threshold -->
  <path d="M 1270 170 C 1300 170, 1300 380, 150 480" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- Second Row Flow -->
  <!-- Row 2 IF Threshold to Branches -->
  <path d="M 370 510 C 430 510, 430 460, 480 460" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="405" y="475" fill="#10b981" font-size="11" font-weight="bold">TRUE (&gt;= 50k Stars)</text>

  <path d="M 370 550 C 430 550, 430 590, 480 590" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="405" y="585" fill="#f59e0b" font-size="11" font-weight="bold">FALSE (&lt; 50k Stars)</text>

  <!-- Branches to Final Dispatch -->
  <path d="M 640 460 C 690 460, 690 515, 740 515" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 640 590 C 690 590, 690 535, 740 535" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Global Error Handler -->
  <path d="M 1090 600 L 1140 600" fill="none" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow-red)"/>

  <!-- NODES -->

  <!-- Node 1: Schedule Trigger -->
  <g filter="url(#shadow)">
    <rect x="40" y="115" width="140" height="90" rx="10" fill="#2d2b40" stroke="#3b82f6" stroke-width="2"/>
    <rect x="40" y="115" width="140" height="26" rx="10" fill="url(#grad-blue)"/>
    <text x="110" y="132" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">Schedule Trigger</text>
    <text x="110" y="162" fill="#cbd5e1" font-size="11" text-anchor="middle">Interval: 1 Hour</text>
    <text x="110" y="182" fill="#94a3b8" font-size="10" text-anchor="middle">Automated Cron</text>
  </g>

  <!-- Node 2: Webhook Trigger -->
  <g filter="url(#shadow)">
    <rect x="40" y="235" width="140" height="90" rx="10" fill="#2d2b40" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="40" y="235" width="140" height="26" rx="10" fill="url(#grad-purple)"/>
    <text x="110" y="252" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">Webhook Trigger</text>
    <text x="110" y="282" fill="#cbd5e1" font-size="11" text-anchor="middle">POST /morning-brief</text>
    <text x="110" y="302" fill="#94a3b8" font-size="10" text-anchor="middle">Manual / Curl Test</text>
  </g>

  <!-- Node 3: First HTTP Request -->
  <g filter="url(#shadow)">
    <rect x="270" y="185" width="160" height="95" rx="10" fill="#2d2b40" stroke="#f59e0b" stroke-width="2"/>
    <rect x="270" y="185" width="160" height="26" rx="10" fill="url(#grad-orange)"/>
    <text x="350" y="202" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">HTTP: Fetch Repos</text>
    <text x="350" y="228" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">GitHub Search REST API</text>
    <text x="350" y="246" fill="#cbd5e1" font-size="9.5" text-anchor="middle">stars:&gt;10k lang:ts</text>
    <text x="350" y="264" fill="#a7f3d0" font-size="9" text-anchor="middle">🛡️ Continue On Fail: ON</text>
  </g>

  <!-- Node 4: IF Check Success -->
  <g filter="url(#shadow)">
    <rect x="480" y="185" width="160" height="95" rx="10" fill="#2d2b40" stroke="#3b82f6" stroke-width="2"/>
    <rect x="480" y="185" width="160" height="26" rx="10" fill="url(#grad-blue)"/>
    <text x="560" y="202" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">IF: API Success?</text>
    <text x="560" y="230" fill="#cbd5e1" font-size="10" text-anchor="middle">Checks $json.items</text>
    <text x="560" y="250" fill="#cbd5e1" font-size="9.5" text-anchor="middle">Detects 403 / 500 limits</text>
    <text x="560" y="268" fill="#94a3b8" font-size="9" text-anchor="middle">Prevents Silent Crash</text>
  </g>

  <!-- Node 5: Transform & Filter Code Node -->
  <g filter="url(#shadow)">
    <rect x="700" y="125" width="160" height="95" rx="10" fill="#2d2b40" stroke="#10b981" stroke-width="2"/>
    <rect x="700" y="125" width="160" height="26" rx="10" fill="url(#grad-green)"/>
    <text x="780" y="142" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">Code: Transform Data</text>
    <text x="780" y="168" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">Filters Archived Repos</text>
    <text x="780" y="186" fill="#cbd5e1" font-size="9.5" text-anchor="middle">Sorts &amp; Slices Top 5</text>
    <text x="780" y="204" fill="#cbd5e1" font-size="9" text-anchor="middle">Computes Ratios &amp; Schema</text>
  </g>

  <!-- Node 6: Second HTTP Request (Enrichment) -->
  <g filter="url(#shadow)">
    <rect x="910" y="125" width="160" height="95" rx="10" fill="#2d2b40" stroke="#f59e0b" stroke-width="2"/>
    <rect x="910" y="125" width="160" height="26" rx="10" fill="url(#grad-orange)"/>
    <text x="990" y="142" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">HTTP: Enrich Release</text>
    <text x="990" y="168" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">GitHub Releases API</text>
    <text x="990" y="186" fill="#cbd5e1" font-size="9.5" text-anchor="middle">/repos/{name}/releases</text>
    <text x="990" y="204" fill="#a7f3d0" font-size="9" text-anchor="middle">🛡️ Continue On Fail: ON</text>
  </g>

  <!-- Node 7: Merge Code Node -->
  <g filter="url(#shadow)">
    <rect x="1110" y="125" width="160" height="95" rx="10" fill="#2d2b40" stroke="#10b981" stroke-width="2"/>
    <rect x="1110" y="125" width="160" height="26" rx="10" fill="url(#grad-green)"/>
    <text x="1190" y="142" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">Code: Merge Metadata</text>
    <text x="1190" y="168" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">Joins Repo + Release</text>
    <text x="1190" y="186" fill="#cbd5e1" font-size="9.5" text-anchor="middle">Handles 404 Fallback</text>
    <text x="1190" y="204" fill="#cbd5e1" font-size="9" text-anchor="middle">Tag, Date &amp; Download Assets</text>
  </g>

  <!-- Node 8: Fallback Alert Node -->
  <g filter="url(#shadow)">
    <rect x="700" y="295" width="160" height="90" rx="10" fill="#2d2b40" stroke="#ef4444" stroke-width="2"/>
    <rect x="700" y="295" width="160" height="26" rx="10" fill="url(#grad-red)"/>
    <text x="780" y="312" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">Webhook: Error Alert</text>
    <text x="780" y="338" fill="#fca5a5" font-size="10" font-weight="bold" text-anchor="middle">Alerts Incident Channel</text>
    <text x="780" y="356" fill="#cbd5e1" font-size="9.5" text-anchor="middle">Discord/Slack Webhook</text>
    <text x="780" y="372" fill="#94a3b8" font-size="9" text-anchor="middle">Logs rate limits &amp; codes</text>
  </g>

  <!-- ROW 2: CONDITION & OUTPUT -->
  <!-- Node 9: IF Threshold Node -->
  <g filter="url(#shadow)">
    <rect x="210" y="475" width="160" height="95" rx="10" fill="#2d2b40" stroke="#3b82f6" stroke-width="2"/>
    <rect x="210" y="475" width="160" height="26" rx="10" fill="url(#grad-blue)"/>
    <text x="290" y="492" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">IF: Stars &gt;= 50,000</text>
    <text x="290" y="520" fill="#cbd5e1" font-size="10" text-anchor="middle">Threshold Routing</text>
    <text x="290" y="538" fill="#cbd5e1" font-size="9.5" text-anchor="middle">Mega Repo vs Emerging</text>
    <text x="290" y="556" fill="#94a3b8" font-size="9" text-anchor="middle">Adaptive Formatting</text>
  </g>

  <!-- Node 10: Format Tier 1 -->
  <g filter="url(#shadow)">
    <rect x="480" y="415" width="160" height="90" rx="10" fill="#2d2b40" stroke="#10b981" stroke-width="2"/>
    <rect x="480" y="415" width="160" height="26" rx="10" fill="url(#grad-green)"/>
    <text x="560" y="432" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">Code: Format Tier-1</text>
    <text x="560" y="458" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">Mega-Project Layout</text>
    <text x="560" y="476" fill="#cbd5e1" font-size="9.5" text-anchor="middle">Rich Embeds &amp; Badges</text>
    <text x="560" y="492" fill="#cbd5e1" font-size="9" text-anchor="middle">Release Notes &amp; Topics</text>
  </g>

  <!-- Node 11: Format High-Growth -->
  <g filter="url(#shadow)">
    <rect x="480" y="545" width="160" height="90" rx="10" fill="#2d2b40" stroke="#f59e0b" stroke-width="2"/>
    <rect x="480" y="545" width="160" height="26" rx="10" fill="url(#grad-orange)"/>
    <text x="560" y="562" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">Code: Format Emerging</text>
    <text x="560" y="588" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">Trending Growth Layout</text>
    <text x="560" y="606" fill="#cbd5e1" font-size="9.5" text-anchor="middle">Growth Ratios &amp; Stars</text>
    <text x="560" y="622" fill="#cbd5e1" font-size="9" text-anchor="middle">Compact Digest</text>
  </g>

  <!-- Node 12: Final Output Dispatch -->
  <g filter="url(#shadow)">
    <rect x="740" y="480" width="170" height="95" rx="10" fill="#2d2b40" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="740" y="480" width="170" height="26" rx="10" fill="url(#grad-purple)"/>
    <text x="825" y="497" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">HTTP: Dispatch Digest</text>
    <text x="825" y="522" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">Discord / Slack Webhook</text>
    <text x="825" y="540" fill="#cbd5e1" font-size="9.5" text-anchor="middle">Morning Brief Broadcast</text>
    <text x="825" y="558" fill="#a7f3d0" font-size="9" text-anchor="middle">✅ Authenticated Delivery</text>
  </g>

  <!-- Node 13: Global Error Trigger -->
  <g filter="url(#shadow)">
    <rect x="950" y="555" width="140" height="90" rx="10" fill="#2d2b40" stroke="#ef4444" stroke-width="2"/>
    <rect x="950" y="555" width="140" height="26" rx="10" fill="url(#grad-red)"/>
    <text x="1020" y="572" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">Error Trigger</text>
    <text x="1020" y="600" fill="#fca5a5" font-size="10" font-weight="bold" text-anchor="middle">Global Catch-All</text>
    <text x="1020" y="620" fill="#cbd5e1" font-size="9.5" text-anchor="middle">Listens on workflow err</text>
  </g>

  <!-- Node 14: Global Alert Dispatch -->
  <g filter="url(#shadow)">
    <rect x="1140" y="555" width="160" height="90" rx="10" fill="#2d2b40" stroke="#ef4444" stroke-width="2"/>
    <rect x="1140" y="555" width="160" height="26" rx="10" fill="url(#grad-red)"/>
    <text x="1220" y="572" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">HTTP: Incident Dispatch</text>
    <text x="1220" y="598" fill="#fca5a5" font-size="10" font-weight="bold" text-anchor="middle">On-Call Notification</text>
    <text x="1220" y="618" fill="#cbd5e1" font-size="9.5" text-anchor="middle">Execution ID &amp; Stack</text>
  </g>
</svg>